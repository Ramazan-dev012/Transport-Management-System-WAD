# Server Configuration
server.port=0

# Application Name
spring.application.name=TransportSystem

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# i18n messages encoding
spring.messages.encoding=UTF-8
spring.messages.basename=messages

server.servlet.session.timeout=30m

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=08102006

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true


# Logging
logging.level.root=INFO
logging.level.com.example.transportsystem=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Spring Boot banner
spring.main.banner-mode=console

# =====================
# Spring Mail (SMTP)
# =====================
# Recommended: set real values via environment variables (do not commit secrets).
# Example (do NOT commit real secrets):
# spring.mail.username=tanatarramazan12@gmail.com
# spring.mail.password=xxxxxxx
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# Timeouts (avoid hanging silently)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Enable SMTP debug logs (helps diagnose Gmail errors)
spring.mail.properties.mail.debug=true

# Sender address (can be same as username)
app.mail.from=${MAIL_FROM:${spring.mail.username}}

# Locale
# NOTE: Do not force a fixed locale here; locale is handled by CookieLocaleResolver + ?lang=...
