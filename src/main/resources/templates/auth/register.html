<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Transport System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .brand h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand p {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            margin-top: 5px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .card h2 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card .subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-danger {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #43e97b;
            background: rgba(67,233,123,0.08);
            box-shadow: 0 0 0 3px rgba(67,233,123,0.15);
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .form-hint {
            color: rgba(255,255,255,0.35);
            font-size: 11px;
            margin-top: 5px;
        }

        .btn-success {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(67,233,123,0.35);
        }

        .btn-success:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .divider span {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }

        .login-link {
            text-align: center;
        }

        .login-link p {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .btn-outline {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
            color: #fff;
            text-decoration: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="brand">
        <span class="brand-icon">🚌</span>
        <h1>Transport System</h1>
        <p>Система управления транспортом</p>
    </div>

    <div class="card">
        <h2>Создать аккаунт</h2>
        <p class="subtitle">Зарегистрируйтесь для покупки билетов</p>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <span>⚠️</span>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/auth/register}" method="post">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" placeholder="Придумайте логин" required autofocus minlength="3">
                <p class="form-hint">Минимум 3 символа</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Введите email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Придумайте пароль" required minlength="6">
                <p class="form-hint">Минимум 6 символов</p>
            </div>
            <div class="form-group">
                <label>Подтвердить пароль</label>
                <input type="password" name="confirmPassword" placeholder="Повторите пароль" required minlength="6">
            </div>
            <button type="submit" class="btn-success">Создать аккаунт</button>
        </form>

        <div class="divider"><span>или</span></div>

        <div class="login-link">
            <p>Уже есть аккаунт?</p>
            <a th:href="@{/auth/login}" class="btn-outline">Войти</a>
        </div>
    </div>

    <div class="back-link">
        <a th:href="@{/transport}">← Вернуться на главную без входа</a>
    </div>
</div>
</body>
</html>
