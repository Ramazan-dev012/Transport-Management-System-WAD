<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить автобус — Transport Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --blue: #0057b8; --blue-dark: #003f8a; --blue-light: #e8f0fb;
            --accent: #f5a623; --text: #1a2744; --muted: #6b7a99;
            --white: #ffffff; --bg: #f4f7fc; --border: #dde4f0;
            --green: #27ae60; --red: #e74c3c;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .navbar { background: var(--white); border-bottom: 2px solid var(--blue); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,87,184,0.10); }
        .navbar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 64px; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 40px; height: 40px; background: var(--blue); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .logo-text { font-size: 17px; font-weight: 800; color: var(--blue); }
        .logo-text span { color: var(--accent); }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        .nav-links a { text-decoration: none; color: var(--text); font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 8px; transition: background 0.2s, color 0.2s; }
        .nav-links a:hover, .nav-links a.active { background: var(--blue-light); color: var(--blue); }
        .page-header { background: linear-gradient(120deg, #0057b8 0%, #003f8a 60%, #002966 100%); color: var(--white); padding: 36px 24px; }
        .page-header-inner { max-width: 1200px; margin: 0 auto; }
        .page-header h1 { font-size: 28px; font-weight: 800; }
        .page-header p { color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 4px; }
        .main-content { max-width: 560px; margin: 40px auto; padding: 0 24px 60px; }
        .form-card { background: var(--white); border-radius: 16px; border: 1.5px solid var(--border); padding: 36px; }
        .form-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--text); background: var(--bg); transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: var(--blue); background: var(--white); }
        .form-group input::placeholder { color: var(--muted); }
        .form-actions { display: flex; gap: 12px; margin-top: 28px; }
        .btn-submit { flex: 1; padding: 13px; background: var(--green); color: var(--white); font-size: 15px; font-weight: 800; border: none; border-radius: 10px; cursor: pointer; transition: background 0.2s, transform 0.2s; }
        .btn-submit:hover { background: #219a52; transform: translateY(-1px); }
        .btn-cancel { padding: 13px 20px; background: transparent; border: 1.5px solid var(--border); color: var(--muted); font-size: 14px; font-weight: 700; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-cancel:hover { border-color: var(--text); color: var(--text); }
        .footer { background: var(--text); color: rgba(255,255,255,0.6); padding: 30px 24px; text-align: center; font-size: 13px; }
        .footer-logo { color: var(--white); font-weight: 800; font-size: 16px; margin-bottom: 8px; }
        .footer-logo span { color: var(--accent); }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a href="/transport" class="logo">
            <div class="logo-icon">🚌</div>
            <span class="logo-text">Transport <span>Management System</span></span>
        </a>
        <div class="nav-links">
            <a th:href="@{/transport}">Главная</a>
            <a th:href="@{/transport/buses}" class="active">Автобусы</a>
            <a th:href="@{/transport/passengers}">Пассажиры</a>

            <a th:href="@{/transport/buyTicket}" sec:authorize="!hasRole('ADMIN')">Билеты</a>
            <a th:href="@{/admin/tickets}" sec:authorize="hasRole('ADMIN')">Билеты</a>
        </div>
        <div class="nav-auth" style="display:flex;align-items:center;gap:6px;">
            <a th:href="@{/transport/buses/add(lang='ru')}" style="text-decoration:none;color:inherit;font-weight:700;font-size:12px;">РУ</a>
            <span style="opacity:.35;">|</span>
            <a th:href="@{/transport/buses/add(lang='kk')}" style="text-decoration:none;color:inherit;font-weight:700;font-size:12px;">ҚАЗ</a>
            <span style="opacity:.35;">|</span>
            <a th:href="@{/transport/buses/add(lang='en')}" style="text-decoration:none;color:inherit;font-weight:700;font-size:12px;">EN</a>
        </div>
    </div>
</nav>
<div class="page-header">
    <div class="page-header-inner">
        <h1>🚌 Добавить автобус</h1>
        <p>Регистрация нового транспортного средства</p>
    </div>
</div>
<div class="main-content">
    <div class="form-card">
        <h2>Данные автобуса</h2>
        <form method="post" th:action="@{/transport/buses/create}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="routeNumber">Номер маршрута</label>
                <input type="text" id="routeNumber" name="routeNumber" placeholder="Например: 101" required/>
            </div>
            <div class="form-group">
                <label for="capacity">Вместимость (мест)</label>
                <input type="number" id="capacity" name="capacity" placeholder="Количество мест" min="1" required/>
            </div>
            <div class="form-group">
                <label for="driverName">Имя водителя</label>
                <input type="text" id="driverName" name="driverName" placeholder="Например: Иван Иванов" required/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-submit">✓ Создать автобус</button>
                <a th:href="@{/transport/buses}" class="btn-cancel">Отмена</a>
            </div>
        </form>
    </div>
</div>
<footer class="footer">
    <div class="footer-logo">Transport <span>Management System</span></div>
    <div style="margin-top:14px; color:rgba(255,255,255,0.35); font-size:12px;">© 2026 Transport Management System.</div>
</footer>
</body>
</html>
